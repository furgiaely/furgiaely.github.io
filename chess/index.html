<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="https://i.ibb.co/7d38hKZ8/chess.png">
    <title>Chess Results</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --accent: #f39c12;
            --accent-dark: #e67e22;
            --text: #2c3e50;
            --text-muted: #7f8c8d;
            --text-light: #95a5a6;
            --bg: #f4f6f9;
            --card: #ffffff;
            --border: #dcdde1;
            --chip-bg: #ecf0f1;
            --chip-hover: #d5dbdb;
            --success: #27ae60;
            --danger: #e74c3c;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #1a252f;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .top-bar {
            margin-bottom: 15px;
        }

        .controls {
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #576574;
        }

        .field input,
        .field select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
            transition: border-color 0.2s;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .field input {
            width: 200px;
        }

        .field select.tournament-select {
            width: 260px;
        }

        .field input.label-input {
            width: 200px;
        }

        button {
            padding: 10px 22px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            height: 42px;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-fav {
            background: var(--accent);
            padding: 10px 18px;
        }

        .btn-fav:hover {
            background: var(--accent-dark);
        }

        .btn-fav.active {
            background: var(--accent-dark);
        }

        .quick-access {
            background: var(--card);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 15px;
        }

        .quick-access-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 6px 0;
        }

        .quick-access-row + .quick-access-row {
            border-top: 1px solid #f1f2f6;
        }

        .quick-access-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #576574;
            min-width: 110px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--chip-bg);
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            color: var(--text);
            transition: background 0.2s;
            height: auto;
            font-weight: 500;
        }

        .chip:hover {
            background: var(--chip-hover);
        }

        .chip .chip-remove {
            font-size: 0.9rem;
            color: var(--danger);
            margin-left: 2px;
            cursor: pointer;
            line-height: 1;
        }

        .chip .chip-remove:hover {
            color: #c0392b;
        }

        .chip-empty {
            font-size: 0.8rem;
            color: #b2bec3;
            font-style: italic;
        }

        .view-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .view-tabs button {
            padding: 8px 18px;
            font-size: 0.9rem;
            background: var(--chip-bg);
            color: var(--text);
            height: auto;
            border-radius: 20px;
        }

        .view-tabs button:hover {
            background: var(--chip-hover);
        }

        .view-tabs button.active {
            background: var(--primary);
            color: #fff;
        }

        /* ---------- Viewer toolbar (zoom only) ---------- */
        .viewer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--card);
            padding: 10px 15px;
            border-radius: 10px 10px 0 0;
            border-bottom: 1px solid #f1f2f6;
        }

        .viewer-toolbar-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #576574;
        }

        .viewer-toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .zoom-controls {
            display: inline-flex;
            align-items: center;
            background: var(--chip-bg);
            border-radius: 20px;
            overflow: hidden;
        }

        .zoom-controls button {
            background: transparent;
            color: var(--text);
            border: none;
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0;
            border-radius: 0;
            cursor: pointer;
        }

        .zoom-controls button:hover {
            background: var(--chip-hover);
        }

        .zoom-controls button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .zoom-controls .zoom-level {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text);
            min-width: 46px;
            text-align: center;
            padding: 0 4px;
        }

        /* ---------- Frame wrapper with horizontal scroll ---------- */
        .frame-wrapper {
            background: var(--card);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            min-height: 600px;
        }

        .iframe-scaler {
            transform-origin: top left;
            transition: transform 0.15s ease-out;
        }

        iframe {
            width: 100%;
            height: 750px;
            border: none;
            display: block;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 600px;
            color: var(--text-light);
            font-size: 1rem;
            text-align: center;
            padding: 20px;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 10px;
            min-height: 20px;
        }

        .status.error {
            color: var(--danger);
        }

        .status.success {
            color: var(--success);
        }

        .hidden {
            display: none !important;
        }

        /* ---------- Tablet ---------- */
        @media (max-width: 900px) {
            .field select.tournament-select {
                width: 220px;
            }
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 600px) {
            body {
                padding: 12px;
                padding-top: 12px;
            }

            h1 {
                font-size: 1.3rem;
            }

            .subtitle {
                font-size: 0.8rem;
                margin-bottom: 12px;
            }

            .quick-access {
                padding: 12px 15px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
                gap: 12px;
            }

            .field {
                width: 100%;
            }

            .field input,
            .field select,
            .field select.tournament-select,
            .field input.label-input {
                width: 100%;
                font-size: 16px;
                min-height: 44px;
            }

            .controls button {
                width: 100%;
                height: 48px;
                font-size: 1rem;
            }

            /* View tabs: 2-column grid for 5 tabs */
            .view-tabs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .view-tabs button:last-child:nth-child(odd) {
                grid-column: 1 / -1;
            }

            .view-tabs button {
                padding: 10px 6px;
                font-size: 0.8rem;
                text-align: center;
                min-height: 44px;
            }

            .quick-access-label {
                min-width: 100%;
                font-size: 0.75rem;
            }

            .chip {
                padding: 8px 14px;
                font-size: 0.9rem;
                min-height: 36px;
            }

            .viewer-toolbar {
                padding: 10px 12px;
            }

            .viewer-toolbar-label {
                display: none;
            }

            .viewer-toolbar-actions {
                width: 100%;
                justify-content: center;
            }

            .zoom-controls button {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }

            .zoom-controls .zoom-level {
                min-width: 52px;
                font-size: 0.85rem;
            }

            .frame-wrapper {
                min-height: auto;
            }

            iframe {
                height: 70dvh;
            }

            .placeholder {
                height: 40dvh;
                font-size: 0.9rem;
            }
        }

        /* ---------- Landscape phones ---------- */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding: 8px;
            }

            h1 {
                font-size: 1.1rem;
            }

            .subtitle {
                display: none;
            }

            .quick-access {
                padding: 8px 12px;
            }

            .controls {
                padding: 10px;
                gap: 8px;
            }

            .controls button {
                height: 40px;
                font-size: 0.9rem;
            }

            .view-tabs button {
                min-height: 36px;
                padding: 6px 8px;
                font-size: 0.75rem;
            }

            .viewer-toolbar {
                padding: 6px 10px;
            }

            iframe {
                height: 60dvh;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="top-bar">
            <div>
                <h1>♟ Chess Tournament Viewer</h1>
                <p class="subtitle">
                    Select a Singapore tournament or enter any Chess-Results tournament ID.
                </p>
            </div>
        </div>

        <div class="quick-access">
            <div class="quick-access-row">
                <span class="quick-access-label">⭐ Favourites</span>
                <div id="favouritesList">
                    <span class="chip-empty">No favourites yet</span>
                </div>
            </div>
            <div class="quick-access-row">
                <span class="quick-access-label">🕘 Recent</span>
                <div id="recentList">
                    <span class="chip-empty">No recent tournaments</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="field">
                <label for="sgpTournamentSelect">Singapore Tournament (SGP)</label>
<!--
  SGP tournament list (manually maintained)
  Format: <option value="CHESS_RESULTS_ID" data-type="individual|team">Display Name</option>
  Art values used by this viewer:
    Player List  -> individual: art=3   | team: art=15
    Rankings     -> individual: art=1   | team: art=16
    Pairings     -> both: art=2 (current round)
  Add new tournaments at the top so they appear first.
-->
                <select id="sgpTournamentSelect" class="tournament-select" onchange="onSgpSelect(this.value)">
                    <option value="">— Select a tournament —</option>
                    <option value="1508846" data-type="individual">NAG 2026</option>
                    <option value="1489169" data-type="team">NST 2026</option>
                </select>
            </div>

            <div class="field">
                <label for="tournamentId">Or enter any Tournament ID</label>
                <input
                    type="text"
                    id="tournamentId"
                    placeholder="e.g., 1420853"
                    inputmode="numeric"
                >
            </div>

            <div class="field">
                <label for="labelInput">Label (for favourite)</label>
                <input
                    type="text"
                    id="labelInput"
                    class="label-input"
                    placeholder="e.g., 2026 X Rapid"
                    maxlength="60"
                >
            </div>

            <button onclick="loadView()">Load</button>
            <button id="favBtn" class="btn-fav" onclick="toggleFavourite()">☆ Favourite</button>
        </div>

        <div class="view-tabs" id="viewTabs">
            <button data-view="players" class="active" onclick="setView('players')">
                👥 Player List
            </button>
            <button data-view="rankings" onclick="setView('rankings')">
                🏆 Starting Rank
            </button>
            <button data-view="pairings" onclick="setView('pairings')">
                ⚔ Pairings
            </button>
            <button data-view="events" onclick="setView('events')">
                📅 Tournaments
            </button>
            <button data-view="search" onclick="setView('search')">
                🔍 Search Player
            </button>
        </div>

        <!-- Viewer toolbar: zoom only -->
        <div class="viewer-toolbar">
            <span class="viewer-toolbar-label">Viewer</span>
            <div class="viewer-toolbar-actions">
                <div class="zoom-controls">
                    <button
                        id="zoomOutBtn"
                        onclick="changeZoom(-0.1)"
                        title="Zoom out"
                        aria-label="Zoom out"
                    >−</button>
                    <span class="zoom-level" id="zoomLevel">50%</span>
                    <button
                        id="zoomInBtn"
                        onclick="changeZoom(0.1)"
                        title="Zoom in"
                        aria-label="Zoom in"
                    >+</button>
                </div>
            </div>
        </div>

        <div class="frame-wrapper" id="frameWrapper">
            <div class="placeholder" id="placeholder">
                Select an SGP tournament or enter a tournament ID, then click "Load".
            </div>
            <div class="iframe-scaler" id="iframeScaler" style="display: none;">
                <iframe
                    id="resultsFrame"
                    title="Chess Tournament Data"
                ></iframe>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        /* ---------------- Element references ---------------- */
        const frame = document.getElementById('resultsFrame');
        const frameWrapper = document.getElementById('frameWrapper');
        const iframeScaler = document.getElementById('iframeScaler');
        const placeholder = document.getElementById('placeholder');
        const statusEl = document.getElementById('status');
        const tournamentInput = document.getElementById('tournamentId');
        const labelInput = document.getElementById('labelInput');
        const sgpSelect = document.getElementById('sgpTournamentSelect');
        const favBtn = document.getElementById('favBtn');
        const favouritesList = document.getElementById('favouritesList');
        const recentList = document.getElementById('recentList');
        const zoomLevelEl = document.getElementById('zoomLevel');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');

        let currentView = 'players';

        /* ---------------- Zoom state ---------------- */
        const ZOOM_MIN = 0.4;
        const ZOOM_MAX = 1.5;
        const ZOOM_KEY = 'chessViewer.zoom';
        let zoom = 0.5;

        /* Desktop viewport width to simulate inside the iframe */
        const DESKTOP_WIDTH = 1100;

        /* SGP tournament list URL (Chess-Results federation page) */
        const SGP_EVENTS_URL = 'https://chess-results.com/fed.aspx?lan=1&fed=SGP';

        /* Player search URL (Chess-Results player search page) */
        const PLAYER_SEARCH_URL = 'https://chess-results.com/SpielerSuche.aspx?lan=1';

        /* ---------------- localStorage keys ---------------- */
        const FAV_KEY = 'chessViewer.favourites';
        const RECENT_KEY = 'chessViewer.recent';
        const RECENT_LIMIT = 6;

        /* ---------------- Storage helpers ---------------- */
        function getFavourites() {
            try {
                return JSON.parse(localStorage.getItem(FAV_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveFavourites(list) {
            localStorage.setItem(FAV_KEY, JSON.stringify(list));
        }

        function getRecent() {
            try {
                return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveRecent(list) {
            localStorage.setItem(RECENT_KEY, JSON.stringify(list));
        }

        function loadZoom() {
            try {
                const saved = parseFloat(localStorage.getItem(ZOOM_KEY));
                if (!isNaN(saved) && saved >= ZOOM_MIN && saved <= ZOOM_MAX) {
                    zoom = saved;
                }
            } catch (e) { /* ignore */ }
        }

        function saveZoom() {
            try {
                localStorage.setItem(ZOOM_KEY, String(zoom));
            } catch (e) { /* ignore */ }
        }

        /* ---------------- Zoom logic ---------------- */
        function changeZoom(delta) {
            zoom = Math.round((zoom + delta) * 10) / 10;
            zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom));
            applyZoom();
            saveZoom();
        }

        function applyZoom() {
            const isMobile = window.matchMedia('(max-width: 600px)').matches;

            if (isMobile) {
                iframeScaler.style.width = DESKTOP_WIDTH + 'px';
                iframeScaler.style.transform = 'scale(' + zoom + ')';

                const frameHeight = frame.offsetHeight || 750;
                iframeScaler.style.height = (frameHeight * zoom) + 'px';
                frame.style.height = (frameHeight / zoom) + 'px';
            } else {
                iframeScaler.style.width = '';
                iframeScaler.style.transform = '';
                iframeScaler.style.height = '';
                frame.style.height = '';
            }

            zoomLevelEl.textContent = Math.round(zoom * 100) + '%';
            zoomInBtn.disabled = zoom >= ZOOM_MAX;
            zoomOutBtn.disabled = zoom <= ZOOM_MIN;
        }

        /* ---------------- Label & type resolution ---------------- */
        function getKnownOption(id) {
            return Array.from(sgpSelect.options).find(function (o) {
                return o.value === id;
            }) || null;
        }

        function getKnownLabel(id) {
            const option = getKnownOption(id);
            return option ? option.textContent : null;
        }

        function getTournamentType(id) {
            const option = getKnownOption(id);
            return option && option.dataset.type ? option.dataset.type : 'individual';
        }

        function resolveLabel(id) {
            const custom = labelInput.value.trim();
            if (custom) return custom;
            const known = getKnownLabel(id);
            if (known) return known;
            return 'Tournament ' + id;
        }

        /* ---------------- Favourites logic ---------------- */
        function isFavourite(id) {
            return getFavourites().some(function (f) { return f.id === id; });
        }

        function toggleFavourite() {
            const id = tournamentInput.value.trim();
            if (!id || !/^\d+$/.test(id)) {
                statusEl.textContent = 'Enter or load a valid tournament ID first.';
                statusEl.className = 'status error';
                return;
            }

            let favs = getFavourites();

            if (isFavourite(id)) {
                favs = favs.filter(function (f) { return f.id !== id; });
                statusEl.textContent = `Removed tournament ${id} from favourites.`;
                statusEl.className = 'status';
            } else {
                const label = resolveLabel(id);
                favs.push({ id: id, label: label });
                statusEl.textContent = `Added "${label}" to favourites.`;
                statusEl.className = 'status success';
                labelInput.value = '';
            }

            saveFavourites(favs);
            renderFavourites();
            updateFavButton();
        }

        function renderFavourites() {
            const favs = getFavourites();
            favouritesList.innerHTML = '';

            if (favs.length === 0) {
                favouritesList.innerHTML = '<span class="chip-empty">No favourites yet</span>';
                return;
            }

            favs.forEach(function (fav) {
                favouritesList.appendChild(makeChip(fav.id, fav.label, true));
            });
        }

        function updateFavButton() {
            const id = tournamentInput.value.trim();
            if (id && isFavourite(id)) {
                favBtn.textContent = '★ Favourited';
                favBtn.classList.add('active');
            } else {
                favBtn.textContent = '☆ Favourite';
                favBtn.classList.remove('active');
            }
        }

        /* ---------------- Recent history logic ---------------- */
        function addToRecent(id) {
            let recent = getRecent();
            recent = recent.filter(function (r) { return r.id !== id; });

            const label = labelInput.value.trim()
                || getKnownLabel(id)
                || ('Tournament ' + id);

            recent.unshift({ id: id, label: label });

            if (recent.length > RECENT_LIMIT) {
                recent = recent.slice(0, RECENT_LIMIT);
            }

            saveRecent(recent);
            renderRecent();
        }

        function renderRecent() {
            const recent = getRecent();
            recentList.innerHTML = '';

            if (recent.length === 0) {
                recentList.innerHTML = '<span class="chip-empty">No recent tournaments</span>';
                return;
            }

            recent.forEach(function (item) {
                recentList.appendChild(makeChip(item.id, item.label, false));
            });
        }

        /* ---------------- Chip builder ---------------- */
        function makeChip(id, label, isFav) {
            const chip = document.createElement('button');
            chip.className = 'chip';
            chip.title = `Load tournament ${id}`;
            chip.innerHTML = `<span>${escapeHtml(label)}</span>`;

            if (isFav) {
                const remove = document.createElement('span');
                remove.className = 'chip-remove';
                remove.textContent = '×';
                remove.title = 'Remove from favourites';
                remove.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const favs = getFavourites().filter(function (f) { return f.id !== id; });
                    saveFavourites(favs);
                    renderFavourites();
                    updateFavButton();
                });
                chip.appendChild(remove);
            }

            chip.addEventListener('click', function () {
                tournamentInput.value = id;
                sgpSelect.value = getKnownLabel(id) ? id : '';
                labelInput.value = label.startsWith('Tournament ') ? '' : label;
                updateFavButton();
                loadView();
            });

            return chip;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* ---------------- Input listeners ---------------- */
        tournamentInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                loadView();
            }
        });

        labelInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                toggleFavourite();
            }
        });

        tournamentInput.addEventListener('input', function () {
            if (sgpSelect.value && sgpSelect.value !== tournamentInput.value.trim()) {
                sgpSelect.value = '';
            }
            updateFavButton();
        });

        /* ---------------- SGP dropdown ---------------- */
        function onSgpSelect(value) {
            if (!value) return;
            tournamentInput.value = value;
            const opt = sgpSelect.options[sgpSelect.selectedIndex];
            labelInput.value = opt ? opt.textContent : '';
            updateFavButton();
            // If user was on Events or Search tab, switch back to Player List
            if (currentView === 'events' || currentView === 'search') {
                setView('players');
            } else {
                loadView();
            }
        }

        /* ---------------- View switching ---------------- */
        function setView(view) {
            currentView = view;

            document.querySelectorAll('#viewTabs button').forEach(function (btn) {
                btn.classList.toggle('active', btn.dataset.view === view);
            });

            // Events tab: load the SGP federation page
            if (view === 'events') {
                loadEventsPage();
                return;
            }

            // Search tab: load the player search page
            if (view === 'search') {
                loadSearchPage();
                return;
            }

            // Other tabs: if we have a tournament ID, load it
            if (tournamentInput.value.trim()) {
                loadView();
            }
        }

        /* ---------------- Events page loader ---------------- */
        function loadEventsPage() {
            statusEl.textContent = 'Loading SGP tournament list...';
            statusEl.className = 'status';

            placeholder.style.display = 'none';
            iframeScaler.style.display = 'block';
            frame.src = SGP_EVENTS_URL;

            applyZoom();

            frame.onload = function () {
                statusEl.textContent = 'Loaded SGP tournament list.';
                statusEl.className = 'status success';
                applyZoom();
            };
        }

        /* ---------------- Player search loader ---------------- */
        function loadSearchPage() {
            statusEl.textContent = 'Loading player search...';
            statusEl.className = 'status';

            placeholder.style.display = 'none';
            iframeScaler.style.display = 'block';
            frame.src = PLAYER_SEARCH_URL;

            applyZoom();

            frame.onload = function () {
                statusEl.textContent = 'Loaded player search.';
                statusEl.className = 'status success';
                applyZoom();
            };
        }

        /* ---------------- Main loader ---------------- */
        function loadView() {
            const tnr = tournamentInput.value.trim();

            if (!tnr || !/^\d+$/.test(tnr)) {
                statusEl.textContent = 'Please enter a valid numeric tournament ID.';
                statusEl.className = 'status error';
                return;
            }

            const tournamentType = getTournamentType(tnr);
            const isTeam = tournamentType === 'team';

            let url = `https://chess-results.com/Tnr${tnr}.aspx?lan=1&turdet=YES&iframe=YES`;
            let label = '';

            if (currentView === 'players') {
                url += isTeam ? '&art=15' : '&art=3';
                label = 'player list';
            } else if (currentView === 'rankings') {
                url += isTeam ? '&art=16' : '&art=1';
                label = isTeam ? 'team rankings' : 'rankings';
            } else if (currentView === 'pairings') {
                // Current round only
                url += '&art=2&rd=-1';
                label = 'pairings (current round)';
            }

            statusEl.textContent = `Loading ${label} for tournament ${tnr}...`;
            statusEl.className = 'status';

            placeholder.style.display = 'none';
            iframeScaler.style.display = 'block';
            frame.src = url;

            applyZoom();

            frame.onload = function () {
                statusEl.textContent = `Loaded ${label} for tournament ${tnr}.`;
                statusEl.className = 'status success';
                applyZoom();
            };

            addToRecent(tnr);
            updateFavButton();
        }

        /* ---------------- Viewport changes ---------------- */
        window.addEventListener('resize', applyZoom);

        /* ---------------- Initial render ---------------- */
        loadZoom();
        applyZoom();
        renderFavourites();
        renderRecent();
        updateFavButton();
    </script>

</body>
</html>
