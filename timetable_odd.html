<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Odd Week</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .image-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        .responsive-image {
            height: 100vh;
            width: auto;
            max-width: none;
            object-fit: contain;
        }
        
        /* Scroll hint */
        .scroll-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        
        .scroll-icon {
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
        }
        
        .scroll-icon::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
            background-color: white;
            border-radius: 1px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { top: 4px; }
            50% { top: 8px; }
        }
        
        /* Touch scrolling enhancement */
        .touch-scroll {
            -webkit-overflow-scrolling: touch;
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Image info */
        .image-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            z-index: 10;
        }
        
        /* Auto-hide controls */
        .controls {
            transition: opacity 0.3s ease;
        }
        
        .image-container:hover .controls {
            opacity: 1;
        }
        
        .image-container:not(:hover) .controls {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading timetable...</p>
    </div>
    
    <div class="image-container touch-scroll" id="imageContainer">
        <div class="image-info controls">
            Odd Week Timetable
        </div>
        
        <img 
            src="timetable_odd.png" 
            alt="Odd Week Timetable" 
            class="responsive-image"
            id="timetableImage"
            onload="hideLoading()"
            onerror="handleImageError()"
        >
        
        <div class="scroll-hint controls">
            <span>Swipe horizontally</span>
            <div class="scroll-icon"></div>
        </div>
    </div>

    <script>
        function hideLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 500);
            
            // Enable horizontal scrolling if needed
            enableHorizontalScroll();
        }
        
        function handleImageError() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
                    <h3>Image Not Found</h3>
                    <p>Could not load timetable_odd.png</p>
                    <p style="margin-top: 20px; font-size: 14px; opacity: 0.8;">
                        Please ensure the image file exists in the same directory
                    </p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Retry
                    </button>
                </div>
            `;
        }
        
        function enableHorizontalScroll() {
            const container = document.getElementById('imageContainer');
            const image = document.getElementById('timetableImage');
            
            // Check if image is wider than container
            function checkScrollNeeded() {
                if (!image.complete) return;
                
                const containerWidth = container.clientWidth;
                const imageWidth = image.naturalWidth || image.width;
                
                if (imageWidth > containerWidth) {
                    container.style.overflowX = 'auto';
                } else {
                    container.style.overflowX = 'hidden';
                    // Hide scroll hint if no scrolling needed
                    document.querySelector('.scroll-hint').style.display = 'none';
                }
            }
            
            // Check when image loads and on resize
            image.addEventListener('load', checkScrollNeeded);
            window.addEventListener('resize', checkScrollNeeded);
            
            // Check initially
            if (image.complete) {
                checkScrollNeeded();
            }
            
            // Add wheel support for horizontal scrolling
            container.addEventListener('wheel', function(e) {
                if (e.deltaY !== 0 && Math.abs(e.deltaX) < Math.abs(e.deltaY)) {
                    e.preventDefault();
                    this.scrollLeft += e.deltaY;
                }
            });
        }
        
        // Auto-hide controls after 3 seconds
        setTimeout(() => {
            const controls = document.querySelectorAll('.controls');
            controls.forEach(control => {
                control.style.opacity = '0.3';
                control.style.transition = 'opacity 0.5s ease';
            });
        }, 3000);
        
        // Show controls when touched/clicked
        document.getElementById('imageContainer').addEventListener('click', function() {
            const controls = document.querySelectorAll('.controls');
            controls.forEach(control => {
                control.style.opacity = '1';
            });
            
            // Auto-hide again after 3 seconds
            setTimeout(() => {
                controls.forEach(control => {
                    control.style.opacity = '0.3';
                });
            }, 3000);
        });
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // If image is already loaded (cached), hide loading immediately
            if (document.getElementById('timetableImage').complete) {
                hideLoading();
            }
        });
    </script>
</body>
</html>
