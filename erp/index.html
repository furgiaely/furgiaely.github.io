<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Singapore ERP Gantry Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            height: 100%;
            width: 100%;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        #map {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* ============================================
           MOBILE-FRIENDLY CONTROLS
           ============================================ */
        #controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 8px 12px;
            background: rgba(26, 115, 232, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            min-height: 48px;
            transition: all 0.3s ease;
        }
        
        #controls .title {
            color: white;
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        
        #controls .title .icon {
            font-size: 18px;
        }
        
        #controls .legend {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(255,255,255,0.12);
            padding: 3px 10px;
            border-radius: 16px;
            flex-shrink: 0;
        }
        
        #controls .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: white;
            font-size: 11px;
            font-weight: 500;
        }
        
        #controls .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.8);
            flex-shrink: 0;
        }
        
        #controls .legend-dot.active { background: #ff4444; }
        #controls .legend-dot.inactive { background: #888; }
        
        #controls .status {
            color: white;
            font-size: 10px;
            margin-left: auto;
            background: rgba(255,255,255,0.1);
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            flex-shrink: 0;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        #controls button {
            padding: 4px 12px;
            border: none;
            border-radius: 16px;
            background: white;
            color: #1a73e8;
            font-weight: 600;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            height: 28px;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
        }
        
        #controls button:active {
            transform: scale(0.95);
            background: #e8f0fe;
        }
        
        /* ============================================
           LOADING OVERLAY
           ============================================ */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }
        
        #loading.show { 
            display: flex; 
        }
        
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #loading .text {
            font-weight: 600;
            color: #1a73e8;
            font-size: 14px;
        }
        
        /* ============================================
           POPUP - MOBILE OPTIMISED
           ============================================ */
        .gantry-popup {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 0;
            max-width: 320px;
            min-width: 200px;
        }
        
        .gantry-popup .popup-header {
            background: #1a73e8;
            color: white;
            padding: 10px 14px;
            border-radius: 8px 8px 0 0;
            margin: -10px -10px 0 -10px;
        }
        
        .gantry-popup .popup-header h3 {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            word-break: break-word;
        }
        
        .gantry-popup .popup-header .sub {
            font-size: 10px;
            opacity: 0.85;
            margin-top: 2px;
            word-break: break-word;
        }
        
        .gantry-popup .popup-body {
            padding: 6px 0;
        }
        
        .gantry-popup .info-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
            gap: 8px;
        }
        
        .gantry-popup .info-row:last-child {
            border-bottom: none;
        }
        
        .gantry-popup .info-row .label {
            font-weight: 600;
            color: #555;
            flex-shrink: 0;
        }
        
        .gantry-popup .info-row .value {
            color: #333;
            text-align: right;
            word-break: break-word;
        }
        
        .gantry-popup .info-row .value.active {
            color: #dc3545;
            font-weight: 600;
        }
        
        .gantry-popup .info-row .value.inactive {
            color: #888;
        }
        
        .gantry-popup .rates-section {
            margin-top: 6px;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 6px 8px;
            border: 1px solid #e9ecef;
        }
        
        .gantry-popup .rates-section .rate-title {
            font-weight: 600;
            font-size: 11px;
            color: #555;
            margin-bottom: 3px;
        }
        
        .gantry-popup .rate-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 11px;
            border-bottom: 1px dashed #e9ecef;
            gap: 8px;
        }
        
        .gantry-popup .rate-item:last-child {
            border-bottom: none;
        }
        
        .gantry-popup .rate-item .time {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #333;
            font-size: 11px;
        }
        
        .gantry-popup .rate-item .price {
            font-weight: 700;
            color: #1a73e8;
            font-size: 11px;
        }
        
        .gantry-popup .rate-item .price.active-rate {
            color: #dc3545;
            background: #fff5f5;
            padding: 0 6px;
            border-radius: 3px;
        }
        
        .gantry-popup .rate-item .price.inactive-rate {
            color: #999;
            text-decoration: line-through;
        }
        
        .gantry-popup .popup-footer {
            font-size: 9px;
            color: #999;
            padding-top: 4px;
            border-top: 1px solid #eee;
            margin-top: 4px;
            text-align: center;
        }
        
        /* ============================================
           GOOGLE MAPS INFO WINDOW OVERRIDES
           ============================================ */
        .gm-style .gm-style-iw-c {
            padding: 10px !important;
            border-radius: 10px !important;
            max-width: 340px !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2) !important;
        }
        
        .gm-style .gm-style-iw-tc::after {
            background: #1a73e8 !important;
        }
        
        .gm-style .gm-style-iw-d {
            overflow: auto !important;
            max-height: 300px !important;
        }
        
        /* ============================================
           DAY BADGE
           ============================================ */
        .day-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 1px;
            white-space: nowrap;
        }
        .day-badge.weekday {
            background: #cce5ff;
            color: #004085;
        }
        .day-badge.weekend {
            background: #f8d7da;
            color: #721c24;
        }
        
        /* ============================================
           RESPONSIVE BREAKPOINTS
           ============================================ */
        
        /* Small phones */
        @media (max-width: 480px) {
            #controls {
                padding: 6px 8px;
                gap: 6px;
                min-height: 42px;
            }
            
            #controls .title {
                font-size: 13px;
            }
            
            #controls .title .icon {
                font-size: 15px;
            }
            
            #controls .legend {
                padding: 2px 8px;
                gap: 5px;
            }
            
            #controls .legend-item {
                font-size: 9px;
            }
            
            #controls .legend-dot {
                width: 6px;
                height: 6px;
            }
            
            #controls .status {
                font-size: 9px;
                padding: 2px 8px;
                max-width: 120px;
            }
            
            #controls button {
                font-size: 10px;
                padding: 3px 10px;
                height: 24px;
            }
            
            .gantry-popup {
                max-width: 260px;
                min-width: 180px;
            }
            
            .gantry-popup .popup-header h3 {
                font-size: 13px;
            }
            
            .gantry-popup .popup-header .sub {
                font-size: 9px;
            }
            
            .gantry-popup .info-row {
                font-size: 11px;
                padding: 2px 0;
            }
            
            .gantry-popup .rate-item {
                font-size: 10px;
                padding: 2px 0;
            }
            
            .gantry-popup .rate-item .time {
                font-size: 10px;
            }
            
            .gantry-popup .rate-item .price {
                font-size: 10px;
            }
            
            .gm-style .gm-style-iw-c {
                max-width: 280px !important;
                padding: 8px !important;
            }
            
            .day-badge {
                font-size: 9px;
                padding: 1px 6px;
            }
            
            #loading .text {
                font-size: 13px;
            }
            
            #loading .spinner {
                width: 32px;
                height: 32px;
                border-width: 3px;
            }
        }
        
        /* Tablets and medium screens */
        @media (min-width: 481px) and (max-width: 1024px) {
            #controls {
                padding: 10px 16px;
                min-height: 52px;
            }
            
            #controls .title {
                font-size: 16px;
            }
            
            #controls .legend-item {
                font-size: 12px;
            }
            
            #controls .status {
                font-size: 11px;
                max-width: 200px;
            }
            
            #controls button {
                font-size: 12px;
                padding: 5px 14px;
                height: 30px;
            }
            
            .gantry-popup {
                max-width: 340px;
                min-width: 240px;
            }
            
            .gm-style .gm-style-iw-c {
                max-width: 360px !important;
            }
        }
        
        /* Landscape phones */
        @media (max-height: 500px) and (orientation: landscape) {
            #controls {
                padding: 4px 10px;
                min-height: 36px;
            }
            
            #controls .title {
                font-size: 12px;
            }
            
            #controls .title .icon {
                font-size: 13px;
            }
            
            #controls .legend {
                padding: 2px 6px;
            }
            
            #controls .legend-item {
                font-size: 9px;
            }
            
            #controls .status {
                font-size: 9px;
                padding: 2px 6px;
                max-width: 100px;
            }
            
            #controls button {
                font-size: 9px;
                padding: 2px 8px;
                height: 22px;
            }
            
            #map {
                height: 100%;
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a2e;
            }
            
            #controls {
                background: rgba(20, 20, 40, 0.95);
            }
            
            #loading {
                background: rgba(0,0,0,0.85);
            }
            
            #loading .text {
                color: #4a9eff;
            }
            
            #loading .spinner {
                border-color: #2a2a4a;
                border-top-color: #4a9eff;
            }
            
            .gantry-popup .popup-header {
                background: #0d47a1;
            }
            
            .gantry-popup .rates-section {
                background: #1a1a2e;
                border-color: #2a2a4a;
            }
            
            .gantry-popup .info-row {
                border-bottom-color: #2a2a4a;
            }
            
            .gantry-popup .info-row .label {
                color: #aaa;
            }
            
            .gantry-popup .info-row .value {
                color: #ddd;
            }
            
            .gantry-popup .rate-item {
                border-bottom-color: #2a2a4a;
            }
            
            .gantry-popup .rate-item .time {
                color: #ddd;
            }
            
            .gantry-popup .popup-footer {
                border-top-color: #2a2a4a;
                color: #666;
            }
            
            .day-badge.weekday {
                background: #0d47a1;
                color: #90caf9;
            }
            
            .day-badge.weekend {
                background: #4a1a1a;
                color: #ef9a9a;
            }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading" class="show">
    <div class="spinner"></div>
    <div class="text">⏳ Loading ERP data...</div>
</div>

<!-- Controls -->
<div id="controls">
    <span class="title"><span class="icon">🚗</span> ERP Map</span>
    
    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot active"></div>
            <span>Active</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot inactive"></div>
            <span>Inactive</span>
        </div>
    </div>
    
    <button id="refreshButton">⟳ Refresh</button>
    <span class="status" id="dateStatus">Loading...</span>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Google Maps JavaScript API -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA0V4zWCMnS4NLVU9Z9srNixIhIMW1V8us&callback=initMap" async defer></script>

<script>
    // ============================================
    // GLOBAL VARIABLES
    // ============================================
    let map;
    let markers = [];
    let gantryData = [];
    let infoWindows = [];
    let polylines = [];
    let ratesData = {};
    let refreshInProgress = false;

    // ============================================
    // HELPER: Check if rate is $0.00
    // ============================================
    function isZeroRate(rateString) {
        if (!rateString) return true;
        const cleanRate = rateString.replace('$', '').trim();
        return parseFloat(cleanRate) === 0;
    }

    // ============================================
    // HELPER: Check if today is a weekday (Mon-Fri)
    // ============================================
    function isWeekday(date) {
        const day = date.getDay();
        return day >= 1 && day <= 5;
    }

    // ============================================
    // HELPER: Get day type label
    // ============================================
    function getDayTypeLabel(date) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        return days[date.getDay()];
    }

    // ============================================
    // UTILITY FUNCTIONS
    // ============================================
    function isWithinWindow(timeStr, windowStart, windowEnd) {
        const [h, m] = timeStr.split(':').map(Number);
        const timeInMinutes = h * 60 + m;
        const [startH, startM] = windowStart.split(':').map(Number);
        const startInMinutes = startH * 60 + startM;
        const [endH, endM] = windowEnd.split(':').map(Number);
        const endInMinutes = endH * 60 + endM;
        return timeInMinutes >= startInMinutes && timeInMinutes < endInMinutes;
    }

    function getActiveWindow(gantry, timeStr, currentDate) {
        if (!isWeekday(currentDate)) {
            return null;
        }
        
        if (!gantry.windows || gantry.windows.length === 0) {
            return null;
        }
        for (const window of gantry.windows) {
            if (isZeroRate(window.rate)) {
                continue;
            }
            if (isWithinWindow(timeStr, window.start, window.end)) {
                return window;
            }
        }
        return null;
    }

    // ============================================
    // PROCESS GEOJSON TO GANTRY FORMAT
    // ============================================
    function processGeoJSONtoGantryData(geojson) {
        const result = [];
        
        if (!geojson.features || !Array.isArray(geojson.features)) {
            console.error('Invalid GeoJSON: no features array');
            return result;
        }
        
        geojson.features.forEach((feature, index) => {
            try {
                const coords = feature.geometry.coordinates;
                const gantryNum = feature.properties.GNTRY_NUM || 'UNK';
                const uniqueId = feature.properties.UNIQUE_ID || `gantry_${index}`;
                
                const gantryName = feature.properties.GANTRY_NAME || 
                                  (gantryNum !== 'UNK' ? `Gantry ${gantryNum}` : `Gantry ${index + 1}`);
                
                const startLng = coords[0][0];
                const startLat = coords[0][1];
                const endLng = coords[1] ? coords[1][0] : startLng;
                const endLat = coords[1] ? coords[1][1] : startLat;
                
                const midLng = (startLng + endLng) / 2;
                const midLat = (startLat + endLat) / 2;
                
                result.push({
                    id: uniqueId,
                    gantryNumber: gantryNum,
                    name: gantryName,
                    location: gantryNum !== 'UNK' ? `Gantry ${gantryNum}` : 'Unknown Gantry',
                    lat: midLat,
                    lng: midLng,
                    startLat: startLat,
                    startLng: startLng,
                    endLat: endLat,
                    endLng: endLng,
                    windows: [],
                    rawProperties: feature.properties,
                    fullGeometry: feature.geometry
                });
            } catch (e) {
                console.warn('Skipping invalid feature:', feature, e);
            }
        });
        
        return result;
    }

    // ============================================
    // MERGE RATES DATA
    // ============================================
    function mergeRates(gantryData, ratesData) {
        return gantryData.map(gantry => {
            const gantryNum = gantry.gantryNumber.toString();
            if (ratesData[gantryNum]) {
                gantry.windows = ratesData[gantryNum]
                    .filter(w => !isZeroRate(w.rate))
                    .map(w => ({ ...w }));
            }
            return gantry;
        });
    }

    // ============================================
    // LOAD DATA FROM EXTERNAL FILES (with cache-busting)
    // ============================================
    async function loadGantryData(forceRefresh = false) {
        if (refreshInProgress) return;
        refreshInProgress = true;
        
        const loadingElement = document.getElementById('loading');
        loadingElement.classList.add('show');
        
        try {
            const cacheBuster = forceRefresh ? `?t=${Date.now()}` : '';
            
            console.log(`📡 Loading GeoJSON...${cacheBuster}`);
            const geoResponse = await fetch(`erp_gantries.geojson${cacheBuster}`);
            if (!geoResponse.ok) {
                throw new Error(`GeoJSON HTTP error! status: ${geoResponse.status}`);
            }
            const geojson = await geoResponse.json();
            console.log('✅ Loaded GeoJSON data:', geojson);
            
            console.log(`📡 Loading ERP rates...${cacheBuster}`);
            const ratesResponse = await fetch(`erp_rates.json${cacheBuster}`);
            if (!ratesResponse.ok) {
                throw new Error(`Rates HTTP error! status: ${ratesResponse.status}`);
            }
            ratesData = await ratesResponse.json();
            console.log('✅ Loaded ERP rates data:', ratesData);
            
            const processedData = processGeoJSONtoGantryData(geojson);
            console.log('✅ Processed gantry data:', processedData);
            
            const mergedData = mergeRates(processedData, ratesData);
            
            gantryData = mergedData;
            
            loadingElement.classList.remove('show');
            
            if (forceRefresh) {
                const statusEl = document.getElementById('dateStatus');
                statusEl.textContent = `✅ Updated ${new Date().toLocaleTimeString()}`;
                setTimeout(() => {
                    updateMapStatus();
                }, 2000);
            }
            
            refreshInProgress = false;
            return gantryData;
            
        } catch (error) {
            console.error('❌ Error loading data:', error);
            document.getElementById('dateStatus').textContent = '⚠️ Error loading data';
            loadingElement.classList.remove('show');
            refreshInProgress = false;
            return [];
        }
    }

    // ============================================
    // UPDATE MAP STATUS
    // ============================================
    function updateMapStatus() {
        const currentTime = new Date();
        const timeStr = currentTime.toTimeString().slice(0, 5);
        const currentDate = new Date();
        const isWeekdayToday = isWeekday(currentDate);
        const weekdayStatus = isWeekdayToday ? 'Weekday' : 'Weekend';
        const activeCount = gantryData.filter(g => {
            const activeWindow = getActiveWindow(g, timeStr, currentDate);
            return activeWindow !== null;
        }).length;
        const statusText = `✅ ${gantryData.length} | 🟢 ${activeCount} | ${weekdayStatus} | ⏰ ${timeStr}`;
        document.getElementById('dateStatus').textContent = statusText;
    }

    // ============================================
    // MAP FUNCTIONS
    // ============================================
    async function initMap() {
        const singapore = { lat: 1.3521, lng: 103.8198 };
        
        // Check if we're on mobile for better defaults
        const isMobile = window.innerWidth < 768;
        
        map = new google.maps.Map(document.getElementById('map'), {
            zoom: isMobile ? 11 : 12,
            center: singapore,
            mapTypeId: 'roadmap',
            zoomControl: true,
            zoomControlOptions: {
                position: google.maps.ControlPosition.RIGHT_BOTTOM
            },
            fullscreenControl: true,
            fullscreenControlOptions: {
                position: google.maps.ControlPosition.RIGHT_BOTTOM
            },
            mapTypeControl: false,
            streetViewControl: false,
            gestureHandling: isMobile ? 'cooperative' : 'auto'
        });

        gantryData = await loadGantryData(false);
        updateMap();

        // Refresh button - forces reload of external files
        document.getElementById('refreshButton').addEventListener('click', async (e) => {
            e.preventDefault();
            if (refreshInProgress) return;
            
            console.log('🔄 Refresh button clicked - reloading data...');
            
            // Clear existing markers
            for (const marker of markers) {
                marker.setMap(null);
            }
            for (const polyline of polylines) {
                polyline.setMap(null);
            }
            for (const infoWindow of infoWindows) {
                infoWindow.close();
            }
            markers = [];
            polylines = [];
            infoWindows = [];
            
            gantryData = await loadGantryData(true);
            updateMap();
        });
    }

    function updateMap() {
        const currentDate = new Date();
        
        for (const marker of markers) {
            marker.setMap(null);
        }
        for (const polyline of polylines) {
            polyline.setMap(null);
        }
        for (const infoWindow of infoWindows) {
            infoWindow.close();
        }
        markers = [];
        polylines = [];
        infoWindows = [];

        const currentTime = new Date();
        const timeStr = currentTime.toTimeString().slice(0, 5);
        const isWeekdayToday = isWeekday(currentDate);
        const dayLabel = getDayTypeLabel(currentDate);
        
        let activeCount = 0;
        let totalCount = gantryData.length;

        for (const gantry of gantryData) {
            let isActive = false;
            let rate = 'No rate data';
            let activeWindow = null;

            activeWindow = getActiveWindow(gantry, timeStr, currentDate);
            if (activeWindow) {
                isActive = true;
                rate = activeWindow.rate;
                activeCount++;
            }

            const position = { lat: gantry.lat, lng: gantry.lng };
            
            const marker = new google.maps.Marker({
                position: position,
                map: map,
                title: gantry.name,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    fillColor: isActive ? '#ff4444' : '#888',
                    fillOpacity: 0.9,
                    strokeWeight: 2,
                    strokeColor: '#FFFFFF',
                    scale: 8
                },
                animation: isActive ? google.maps.Animation.BOUNCE : null,
                optimized: true
            });

            const path = [
                { lat: gantry.startLat, lng: gantry.startLng },
                { lat: gantry.endLat, lng: gantry.endLng }
            ];
            
            const polyline = new google.maps.Polyline({
                path: path,
                strokeColor: isActive ? '#ff4444' : '#888',
                strokeWeight: 3,
                strokeOpacity: 0.7,
                map: map,
                optimized: true
            });
            
            polylines.push(polyline);

            const statusClass = isActive ? 'active' : 'inactive';
            let statusTextDisplay = isActive ? `🟢 Operating (${rate})` : '⚪ Not operating';
            
            if (!isWeekdayToday) {
                statusTextDisplay = '⚪ No ERP on weekends';
            }
            
            let ratesHTML = '';
            if (gantry.windows && gantry.windows.length > 0) {
                ratesHTML = gantry.windows.map(w => {
                    const isActiveRate = !isZeroRate(w.rate) && isWithinWindow(timeStr, w.start, w.end) && isWeekdayToday;
                    const isZero = isZeroRate(w.rate);
                    return `<div class="rate-item">
                        <span class="time">${w.start} - ${w.end}</span>
                        <span class="price ${isActiveRate ? 'active-rate' : ''} ${isZero ? 'inactive-rate' : ''}">${w.rate}</span>
                    </div>`;
                }).join('');
            } else {
                ratesHTML = '<div style="color:#999;font-size:12px;padding:4px 0;">No rate data available</div>';
            }
            
            const gantryNumDisplay = gantry.gantryNumber !== 'UNK' 
                ? `Gantry #${gantry.gantryNumber}` 
                : 'Unknown Gantry';
            
            const dayBadge = isWeekdayToday 
                ? '<span class="day-badge weekday">📅 Weekday</span>' 
                : '<span class="day-badge weekend">📅 Weekend</span>';
            
            const contentString = `
                <div class="gantry-popup">
                    <div class="popup-header">
                        <h3>📍 ${gantry.name}</h3>
                        <div class="sub">${gantryNumDisplay} · ID: ${gantry.id}</div>
                    </div>
                    <div class="popup-body">
                        <div class="info-row">
                            <span class="label">Status</span>
                            <span class="value ${statusClass}">${statusTextDisplay}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Time</span>
                            <span class="value">${timeStr}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Day</span>
                            <span class="value">${dayLabel} ${dayBadge}</span>
                        </div>
                        <div class="rates-section">
                            <div class="rate-title">💰 Operating Windows ${!isWeekdayToday ? '(Weekdays only)' : ''}</div>
                            ${ratesHTML}
                        </div>
                        <div style="margin-top:4px;font-size:10px;color:#999;border-top:1px solid #eee;padding-top:4px;">
                            📍 ${gantry.lat.toFixed(5)}, ${gantry.lng.toFixed(5)}
                        </div>
                    </div>
                    <div class="popup-footer">LTA DataMall</div>
                </div>
            `;

            const infoWindow = new google.maps.InfoWindow({
                content: contentString,
                maxWidth: 320
            });

            // Use touch-friendly click events
            const markerClickHandler = () => {
                for (const iw of infoWindows) {
                    iw.close();
                }
                infoWindow.open(map, marker);
            };
            
            marker.addListener('click', markerClickHandler);
            marker.addListener('touchstart', markerClickHandler);

            polyline.addListener('click', () => {
                for (const iw of infoWindows) {
                    iw.close();
                }
                infoWindow.open(map, marker);
            });

            markers.push(marker);
            infoWindows.push(infoWindow);
        }

        const weekdayStatus = isWeekdayToday ? 'Weekday' : 'Weekend';
        const statusText = `✅ ${totalCount} | 🟢 ${activeCount} | ${weekdayStatus} | ⏰ ${timeStr}`;
        document.getElementById('dateStatus').textContent = statusText;
    }

    // Handle resize events for responsive map
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            if (map) {
                google.maps.event.trigger(map, 'resize');
                // Re-center on resize
                const center = map.getCenter();
                if (center) {
                    map.setCenter(center);
                }
            }
        }, 250);
    });

    // Handle orientation change
    window.addEventListener('orientationchange', () => {
        setTimeout(() => {
            if (map) {
                google.maps.event.trigger(map, 'resize');
            }
        }, 500);
    });

    window.initMap = initMap;

    console.log('📋 ERP Gantry Map Loaded (Mobile Optimised)');
    console.log('📡 Loading GeoJSON from: erp_gantries.geojson');
    console.log('📡 Loading ERP Rates from: erp_rates.json');
    console.log('💡 ERP rates only apply on weekdays (Monday to Friday)');
    console.log('📱 Optimised for mobile devices');
</script>

</body>
</html>
