<!DOCTYPE html>
<html>
<head>
    <title>Singapore ERP Gantry Map</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        
        #map {
            height: calc(100vh - 60px);
            width: 100%;
        }
        
        #controls {
            height: 60px;
            padding: 8px 16px;
            background: #1a73e8;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
        }
        
        #controls .title {
            color: white;
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
        }
        
        #controls .legend {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        #controls .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: white;
            font-size: 12px;
        }
        
        #controls .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid white;
            flex-shrink: 0;
        }
        
        #controls .legend-dot.active { background: #ff4444; }
        #controls .legend-dot.inactive { background: #888; }
        
        #controls .status {
            color: white;
            font-size: 12px;
            margin-left: auto;
            background: rgba(255,255,255,0.1);
            padding: 4px 12px;
            border-radius: 12px;
            white-space: nowrap;
        }
        
        #controls button {
            padding: 5px 14px;
            border: none;
            border-radius: 4px;
            background: white;
            color: #1a73e8;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        #controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
            font-weight: 600;
            color: #1a73e8;
            font-size: 16px;
        }
        
        #loading.show { display: block; }
        
        .gantry-popup {
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 0;
            max-width: 380px;
            min-width: 260px;
        }
        
        .gantry-popup .popup-header {
            background: #1a73e8;
            color: white;
            padding: 10px 14px;
            border-radius: 8px 8px 0 0;
            margin: -10px -10px 0 -10px;
        }
        
        .gantry-popup .popup-header h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }
        
        .gantry-popup .popup-header .sub {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
        }
        
        .gantry-popup .popup-body {
            padding: 8px 0;
        }
        
        .gantry-popup .info-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 13px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .gantry-popup .info-row:last-child {
            border-bottom: none;
        }
        
        .gantry-popup .info-row .label {
            font-weight: 600;
            color: #555;
        }
        
        .gantry-popup .info-row .value {
            color: #333;
        }
        
        .gantry-popup .info-row .value.active {
            color: #dc3545;
            font-weight: 600;
        }
        
        .gantry-popup .info-row .value.inactive {
            color: #888;
        }
        
        .gantry-popup .rates-section {
            margin-top: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 8px 10px;
            border: 1px solid #e9ecef;
        }
        
        .gantry-popup .rates-section .rate-title {
            font-weight: 600;
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
        }
        
        .gantry-popup .rate-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px dashed #e9ecef;
        }
        
        .gantry-popup .rate-item:last-child {
            border-bottom: none;
        }
        
        .gantry-popup .rate-item .time {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #333;
        }
        
        .gantry-popup .rate-item .price {
            font-weight: 700;
            color: #1a73e8;
        }
        
        .gantry-popup .rate-item .price.active-rate {
            color: #dc3545;
            background: #fff5f5;
            padding: 0 6px;
            border-radius: 3px;
        }
        
        .gantry-popup .rate-item .price.inactive-rate {
            color: #999;
            text-decoration: line-through;
        }
        
        .gantry-popup .popup-footer {
            font-size: 10px;
            color: #999;
            padding-top: 6px;
            border-top: 1px solid #eee;
            margin-top: 6px;
            text-align: center;
        }
        
        .gm-style .gm-style-iw-c {
            padding: 10px !important;
            border-radius: 10px !important;
            max-width: 400px !important;
        }
        
        .gm-style .gm-style-iw-tc::after {
            background: #1a73e8 !important;
        }
        
        /* Day type badge */
        .day-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 2px;
        }
        .day-badge.weekday {
            background: #cce5ff;
            color: #004085;
        }
        .day-badge.weekend {
            background: #f8d7da;
            color: #721c24;
        }
        
        @media (max-width: 768px) {
            #controls {
                height: auto;
                padding: 8px 12px;
                gap: 6px;
            }
            #controls .title { font-size: 14px; }
            #controls .status { font-size: 10px; margin-left: 0; }
            #controls .legend { padding: 3px 8px; gap: 6px; }
            #controls .legend-item { font-size: 10px; }
            #controls button { font-size: 11px; padding: 4px 10px; }
            #map { height: calc(100vh - 90px); }
            .gantry-popup { max-width: 280px; min-width: 220px; }
        }
    </style>
</head>

        return day >= 1 && day <= 5; // Monday = 1, Friday = 5

            { start: "08:00", end: "08:30", rate: "$1.00" }
        ],
        'OS074': [
            { start: "07:30", end: "08:00", rate: "$1.50" },
            { start: "08:00", end: "08:30", rate: "$2.00" }
        ]
    };

    // ============================================
    // UTILITY FUNCTIONS
    // ============================================
    function isWithinWindow(timeStr, windowStart, windowEnd) {
        const [h, m] = timeStr.split(':').map(Number);
        const timeInMinutes = h * 60 + m;
        const [startH, startM] = windowStart.split(':').map(Number);
        const startInMinutes = startH * 60 + startM;
        const [endH, endM] = windowEnd.split(':').map(Number);
        const endInMinutes = endH * 60 + endM;
        return timeInMinutes >= startInMinutes && timeInMinutes < endInMinutes;
    }

    function getActiveWindow(gantry, timeStr, currentDate) {
        // 🔴 CHECK: If it's NOT a weekday, return null (no ERP)
        if (!isWeekday(currentDate)) {
            return null;
        }
        
        if (!gantry.windows || gantry.windows.length === 0) {
            return null;
        }
        for (const window of gantry.windows) {
            // Skip $0.00 rates
            if (isZeroRate(window.rate)) {
                continue;
            }
            if (isWithinWindow(timeStr, window.start, window.end)) {
                return window;
            }
        }
        return null;
    }

    // ============================================
    // PROCESS GEOJSON TO GANTRY FORMAT
    // ============================================
    function processGeoJSONtoGantryData(geojson) {
        const result = [];
        
        if (!geojson.features || !Array.isArray(geojson.features)) {
            console.error('Invalid GeoJSON: no features array');
            return result;
        }
        
        geojson.features.forEach((feature, index) => {
            try {
                const coords = feature.geometry.coordinates;
                const gantryNum = feature.properties.GNTRY_NUM || 'UNK';
                const uniqueId = feature.properties.UNIQUE_ID || `gantry_${index}`;
                
                const gantryName = feature.properties.GANTRY_NAME || 
                                  (gantryNum !== 'UNK' ? `Gantry ${gantryNum}` : `Gantry ${index + 1}`);
                
                const startLng = coords[0][0];
                const startLat = coords[0][1];
                const endLng = coords[1] ? coords[1][0] : startLng;
                const endLat = coords[1] ? coords[1][1] : startLat;
                
                const midLng = (startLng + endLng) / 2;
                const midLat = (startLat + endLat) / 2;
                
                result.push({
                    id: uniqueId,
                    gantryNumber: gantryNum,
                    name: gantryName,
                    location: gantryNum !== 'UNK' ? `Gantry ${gantryNum}` : 'Unknown Gantry',
                    lat: midLat,
                    lng: midLng,
                    startLat: startLat,
                    startLng: startLng,
                    endLat: endLat,
                    endLng: endLng,
                    windows: [],
                    rawProperties: feature.properties,
                    fullGeometry: feature.geometry
                });
            } catch (e) {
                console.warn('Skipping invalid feature:', feature, e);
            }
        });
        
        return result;
    }

    // ============================================
    // MERGE RATES DATA
    // ============================================
    function mergeRates(gantryData, ratesData) {
        return gantryData.map(gantry => {
            const gantryNum = gantry.gantryNumber.toString();
            if (ratesData[gantryNum]) {
                // Filter out $0.00 rates
                gantry.windows = ratesData[gantryNum]
                    .filter(w => !isZeroRate(w.rate))
                    .map(w => ({ ...w }));
            }
            return gantry;
        });
    }

    // ============================================
    // LOAD GEOJSON FROM EXTERNAL FILE
    // ============================================
    async function loadGantryData() {
        const loadingElement = document.getElementById('loading');
        loadingElement.classList.add('show');
        
        try {
            console.log('📡 Loading GeoJSON from external file...');
            const response = await fetch('erp_gantries.geojson');
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const geojson = await response.json();
            console.log('✅ Loaded GeoJSON data:', geojson);
            
            const processedData = processGeoJSONtoGantryData(geojson);
            console.log('✅ Processed gantry data:', processedData);
            
            const mergedData = mergeRates(processedData, embeddedRates);
            
            gantryData = mergedData;
            
            loadingElement.classList.remove('show');
            return gantryData;
            
        } catch (error) {
            console.error('❌ Error loading gantry data:', error);
            document.getElementById('dateStatus').textContent = '⚠️ Error loading data: ' + error.message;
            loadingElement.classList.remove('show');
            return [];
        }
    }

    // ============================================
    // MAP FUNCTIONS
    // ============================================
    async function initMap() {
        const singapore = { lat: 1.3521, lng: 103.8198 };
        map = new google.maps.Map(document.getElementById('map'), {
            zoom: 12,
            center: singapore,
            mapTypeId: 'roadmap',
            zoomControl: true,
            zoomControlOptions: {
                position: google.maps.ControlPosition.RIGHT_TOP
            }
        });

        gantryData = await loadGantryData();
        updateMap();

        document.getElementById('refreshButton').addEventListener('click', () => {
            updateMap();
        });
    }

    function updateMap() {
        for (const marker of markers) {
            marker.setMap(null);
        }
        for (const polyline of polylines) {
            polyline.setMap(null);
        }
        for (const infoWindow of infoWindows) {
            infoWindow.close();
        }
        markers = [];
        polylines = [];
        infoWindows = [];

        const currentTime = new Date();
        const timeStr = currentTime.toTimeString().slice(0, 5);
        const currentDate = new Date();
        const isWeekdayToday = isWeekday(currentDate);
        const dayLabel = getDayTypeLabel(currentDate);
        
        let activeCount = 0;
        let totalCount = gantryData.length;

        for (const gantry of gantryData) {
            let isActive = false;
            let rate = 'No rate data';
            let activeWindow = null;

            // 🔴 getActiveWindow now checks if it's a weekday
            activeWindow = getActiveWindow(gantry, timeStr, currentDate);
            if (activeWindow) {
                isActive = true;
                rate = activeWindow.rate;
                activeCount++;
            }

            const position = { lat: gantry.lat, lng: gantry.lng };
            
            const marker = new google.maps.Marker({
                position: position,
                map: map,
                title: gantry.name,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    fillColor: isActive ? '#ff4444' : '#888',
                    fillOpacity: 0.9,
                    strokeWeight: 2,
                    strokeColor: '#FFFFFF',
                    scale: 8
                },
                animation: isActive ? google.maps.Animation.BOUNCE : null
            });

            const path = [
                { lat: gantry.startLat, lng: gantry.startLng },
                { lat: gantry.endLat, lng: gantry.endLng }
            ];
            
            const polyline = new google.maps.Polyline({
                path: path,
                strokeColor: isActive ? '#ff4444' : '#888',
                strokeWeight: 3,
                strokeOpacity: 0.7,
                map: map
            });
            
            polylines.push(polyline);

            const statusClass = isActive ? 'active' : 'inactive';
            let statusTextDisplay = isActive ? `🟢 Operating (${rate})` : '⚪ Not operating';
            
            // If it's a weekend, show special message
            if (!isWeekdayToday) {
                statusTextDisplay = '⚪ No ERP on weekends';
            }
            
            let ratesHTML = '';
            if (gantry.windows && gantry.windows.length > 0) {
                ratesHTML = gantry.windows.map(w => {
                    const isActiveRate = !isZeroRate(w.rate) && isWithinWindow(timeStr, w.start, w.end) && isWeekdayToday;
                    const isZero = isZeroRate(w.rate);
                    return `<div class="rate-item">
                        <span class="time">${w.start} - ${w.end}</span>
                        <span class="price ${isActiveRate ? 'active-rate' : ''} ${isZero ? 'inactive-rate' : ''}">${w.rate}</span>
                    </div>`;
                }).join('');
            } else {
                ratesHTML = '<div style="color:#999;font-size:12px;padding:4px 0;">No rate data available</div>';
            }
            
            const gantryNumDisplay = gantry.gantryNumber !== 'UNK' 
                ? `Gantry #${gantry.gantryNumber}` 
                : 'Unknown Gantry';
            
            const dayBadge = isWeekdayToday 
                ? '<span class="day-badge weekday">📅 Weekday</span>' 
                : '<span class="day-badge weekend">📅 Weekend - No ERP</span>';
            
            const contentString = `
                <div class="gantry-popup">
                    <div class="popup-header">
                        <h3>📍 ${gantry.name}</h3>
                        <div class="sub">${gantryNumDisplay} · ID: ${gantry.id}</div>
                    </div>
                    <div class="popup-body">
                        <div class="info-row">
                            <span class="label">Status</span>
                            <span class="value ${statusClass}">${statusTextDisplay}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Time checked</span>
                            <span class="value">${timeStr}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Day</span>
                            <span class="value">${dayLabel} ${dayBadge}</span>
                        </div>
                        <div class="rates-section">
                            <div class="rate-title">💰 Operating Windows ${!isWeekdayToday ? '(Weekdays only)' : ''}</div>
                            ${ratesHTML}
                        </div>
                        <div style="margin-top:6px;font-size:11px;color:#999;border-top:1px solid #eee;padding-top:4px;">
                            🗺️ Lat: ${gantry.lat.toFixed(6)} · Lng: ${gantry.lng.toFixed(6)}
                        </div>
                    </div>
                    <div class="popup-footer">Data source: LTA DataMall</div>
                </div>
            `;

            const infoWindow = new google.maps.InfoWindow({
                content: contentString,
                maxWidth: 380
            });

            marker.addListener('click', () => {
                for (const iw of infoWindows) {
                    iw.close();
                }
                infoWindow.open(map, marker);
            });

            polyline.addListener('click', () => {
                for (const iw of infoWindows) {
                    iw.close();
                }
                infoWindow.open(map, marker);
            });

            markers.push(marker);
            infoWindows.push(infoWindow);
        }

        const weekdayStatus = isWeekdayToday ? 'Weekday' : 'Weekend (No ERP)';
        const statusText = `✅ ${totalCount} gantries loaded | 🟢 ${activeCount} active | ${weekdayStatus} | ⏰ ${timeStr}`;
        document.getElementById('dateStatus').textContent = statusText;
    }

    window.initMap = initMap;

    console.log('📋 ERP Gantry Map Loaded');
    console.log('📡 Loading GeoJSON from external file: erp_gantries.geojson');
    console.log('📊 Embedded ERP Rates (no external API calls)');
    console.log('💡 ERP rates only apply on weekdays (Monday to Friday)');
</script>
