<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="https://i.ibb.co/Xk8GpvdD/cedar1.png">
    <title>Odd Week Timetable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .timetable-container {
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.5) rgba(0, 0, 0, 0.1);
        }
        
        .timetable-container::-webkit-scrollbar {
            height: 8px;
        }
        
        .timetable-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        
        .timetable-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
        }
        
        .timetable-image {
            height: 100vh;
            width: auto;
            display: block;
            /* Remove any centering, start from left */
        }
        
        /* Loading indicator */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .loading.hidden {
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Simple instruction */
        .instruction {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .arrow {
            width: 20px;
            height: 20px;
            position: relative;
        }
        
        .arrow::before,
        .arrow::after {
            content: "";
            position: absolute;
            background: white;
            height: 2px;
            width: 10px;
            border-radius: 1px;
        }
        
        .arrow::before {
            transform: rotate(45deg);
            right: 6px;
            top: 6px;
        }
        
        .arrow::after {
            transform: rotate(-45deg);
            right: 6px;
            top: 12px;
        }
        
        /* Error styling */
        .error {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }
        
        .error.hidden {
            display: none;
        }
        
        .retry-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading timetable...</p>
    </div>
    
    <div class="error hidden" id="error">
        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
        <h3>Image Not Found</h3>
        <p>Could not load "timetable_odd.png"</p>
        <p style="margin-top: 10px; font-size: 14px; opacity: 0.8;">
            Please ensure the file exists in the same directory
        </p>
        <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>
    
    <div class="timetable-container">
        <img 
            src="timetable_odd.png" 
            alt="Odd Week Timetable" 
            class="timetable-image"
            id="timetableImg"
            onload="imageLoaded()"
            onerror="imageError()"
        >
    </div>
    
    <div class="instruction" id="instruction">
        <span>Swipe left to see more</span>
        <div class="arrow"></div>
    </div>

    <script>
        function imageLoaded() {
            const loading = document.getElementById('loading');
            const instruction = document.getElementById('instruction');
            const img = document.getElementById('timetableImg');
            
            // Hide loading after a short delay
            setTimeout(() => {
                loading.classList.add('hidden');
                
                // Check if scrolling is needed
                if (img.naturalWidth > window.innerWidth) {
                    instruction.style.display = 'flex';
                    
                    // Auto-hide instruction after 5 seconds
                    setTimeout(() => {
                        instruction.style.opacity = '0';
                        instruction.style.transition = 'opacity 1s ease';
                        setTimeout(() => instruction.style.display = 'none', 1000);
                    }, 5000);
                } else {
                    instruction.style.display = 'none';
                }
            }, 500);
            
            // Ensure image starts from left edge
            img.style.marginLeft = '0';
        }
        
        function imageError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('instruction').style.display = 'none';
        }
        
        // Hide instruction when user starts scrolling
        document.querySelector('.timetable-container').addEventListener('scroll', function() {
            const instruction = document.getElementById('instruction');
            if (instruction.style.display !== 'none') {
                instruction.style.opacity = '0';
                instruction.style.transition = 'opacity 0.5s ease';
                setTimeout(() => instruction.style.display = 'none', 500);
            }
        });
        
        // Show instruction on tap/click (for testing)
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'timetableImg') return;
            
            const instruction = document.getElementById('instruction');
            if (parseFloat(getComputedStyle(instruction).opacity) < 0.5) {
                instruction.style.display = 'flex';
                instruction.style.opacity = '1';
                instruction.style.transition = 'opacity 0.3s ease';
                
                setTimeout(() => {
                    instruction.style.opacity = '0';
                    setTimeout(() => {
                        if (parseFloat(getComputedStyle(instruction).opacity) < 0.5) {
                            instruction.style.display = 'none';
                        }
                    }, 500);
                }, 3000);
            }
        });
        
        // Auto-scroll to show some of the hidden right side on load
        window.addEventListener('load', function() {
            const img = document.getElementById('timetableImg');
            if (img.complete && img.naturalWidth > window.innerWidth) {
                // Show a bit of the hidden right side by scrolling a little
                setTimeout(() => {
                    document.querySelector('.timetable-container').scrollLeft = 20;
                    setTimeout(() => {
                        document.querySelector('.timetable-container').scrollLeft = 0;
                    }, 300);
                }, 1000);
            }
        });
    </script>
</body>
</html>
