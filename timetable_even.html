<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="https://i.ibb.co/Xk8GpvdD/cedar1.png">
    <title>Even Week Timetable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none; /* Prevent default browser actions */
        }
        
        .timetable-container {
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative;
            /* Enable touch scrolling */
            touch-action: pan-x;
        }
        
        .timetable-image {
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            width: auto;
            display: block;
            max-height: 100%;
            object-fit: contain;
            object-position: left top;
            /* Enable touch on image */
            touch-action: pan-x;
            user-select: none;
            -webkit-user-drag: none;
        }
        
        /* iOS Safe Area Insets */
        @supports (padding: max(0px)) {
            body {
                padding-bottom: env(safe-area-inset-bottom);
                padding-bottom: max(0px, env(safe-area-inset-bottom));
            }
            
            .timetable-image {
                max-height: calc(100vh - env(safe-area-inset-bottom));
                max-height: calc(100vh - max(0px, env(safe-area-inset-bottom)));
            }
        }
        
        /* Loading indicator */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .loading.hidden {
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007AFF;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Simple instruction - positioned above Safari bar */
        .instruction {
            position: fixed;
            bottom: 70px; /* Above Safari bottom bar */
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 50;
        }
        
        @supports (padding: max(0px)) {
            .instruction {
                bottom: calc(70px + env(safe-area-inset-bottom));
            }
        }
        
        .arrow {
            width: 22px;
            height: 22px;
            position: relative;
        }
        
        .arrow::before,
        .arrow::after {
            content: "";
            position: absolute;
            background: white;
            height: 2px;
            width: 11px;
            border-radius: 1px;
        }
        
        .arrow::before {
            transform: rotate(45deg);
            right: 6px;
            top: 7px;
        }
        
        .arrow::after {
            transform: rotate(-45deg);
            right: 6px;
            top: 13px;
        }
        
        /* Error styling */
        .error {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }
        
        .error.hidden {
            display: none;
        }
        
        .retry-btn {
            margin-top: 25px;
            padding: 14px 28px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 500;
        }
        
        /* Bottom safe area spacer for Safari */
        .safari-spacer {
            height: env(safe-area-inset-bottom);
            height: max(0px, env(safe-area-inset-bottom));
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            background: transparent;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Hide scrollbar for cleaner look */
        .timetable-container::-webkit-scrollbar {
            display: none;
        }
        
        .timetable-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Add some margin to prevent touching edges */
        .timetable-container {
            padding-bottom: 1px;
        }
        
        /* Handle dynamic viewport changes */
        @media (orientation: landscape) {
            .instruction {
                bottom: 20px;
            }
            
            @supports (padding: max(0px)) {
                .instruction {
                    bottom: calc(20px + env(safe-area-inset-bottom));
                }
            }
        }
        
        /* Disable text selection */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading timetable...</p>
    </div>
    
    <div class="error hidden" id="error">
        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
        <h3>Image Not Found</h3>
        <p>Could not load "timetable_even.png"</p>
        <p style="margin-top: 10px; font-size: 15px; opacity: 0.8;">
            Ensure the file is in the same folder
        </p>
        <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>
    
    <div class="timetable-container" id="container">
        <img 
            src="timetable_even.png" 
            alt="Even Week Timetable" 
            class="timetable-image"
            id="timetableImg"
            onload="imageLoaded()"
            onerror="imageError()"
        >
    </div>
    
    <div class="safari-spacer"></div>
    
    <div class="instruction" id="instruction">
        <span>Swipe left →</span>
        <div class="arrow"></div>
    </div>

    <script>
        // Set image height dynamically based on available space
        function adjustImageHeight() {
            const img = document.getElementById('timetableImg');
            const container = document.getElementById('container');
            
            if (!img.complete) return;
            
            // Calculate available height considering safe areas
            let availableHeight = window.innerHeight;
            
            // Adjust for iOS safe areas
            if (CSS.supports('padding: env(safe-area-inset-bottom)')) {
                const safeAreaBottom = parseInt(getComputedStyle(document.documentElement)
                    .getPropertyValue('--sat') || '0');
                availableHeight -= safeAreaBottom;
            }
            
            // Set image height to available height
            img.style.height = availableHeight + 'px';
            container.style.height = availableHeight + 'px';
        }
        
        function imageLoaded() {
            const loading = document.getElementById('loading');
            const instruction = document.getElementById('instruction');
            const img = document.getElementById('timetableImg');
            
            // Adjust height first
            adjustImageHeight();
            
            // Hide loading after a short delay
            setTimeout(() => {
                loading.classList.add('hidden');
                
                // Check if scrolling is needed
                if (img.naturalWidth > window.innerWidth) {
                    instruction.style.display = 'flex';
                    
                    // Auto-hide instruction after 4 seconds
                    setTimeout(() => {
                        instruction.style.opacity = '0';
                        instruction.style.transition = 'opacity 0.8s ease';
                        setTimeout(() => {
                            if (parseFloat(getComputedStyle(instruction).opacity) === 0) {
                                instruction.style.display = 'none';
                            }
                        }, 800);
                    }, 4000);
                } else {
                    instruction.style.display = 'none';
                }
                
                // Scroll to show left edge is visible
                const container = document.getElementById('container');
                container.scrollLeft = 0;
                
                // Add a subtle bounce hint if content is scrollable
                if (img.naturalWidth > window.innerWidth) {
                    setTimeout(() => {
                        container.scrollLeft = 30;
                        setTimeout(() => {
                            container.scrollLeft = 0;
                        }, 300);
                    }, 500);
                }
            }, 300);
        }
        
        function imageError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('instruction').style.display = 'none';
            adjustImageHeight();
        }
        
        // Hide instruction when user starts scrolling
        let scrollTimer;
        document.getElementById('container').addEventListener('scroll', function() {
            const instruction = document.getElementById('instruction');
            if (instruction.style.display !== 'none') {
                clearTimeout(scrollTimer);
                instruction.style.opacity = '0.5';
                instruction.style.transition = 'opacity 0.3s ease';
                
                scrollTimer = setTimeout(() => {
                    instruction.style.opacity = '0';
                    setTimeout(() => {
                        if (parseFloat(getComputedStyle(instruction).opacity) < 0.1) {
                            instruction.style.display = 'none';
                        }
                    }, 300);
                }, 1000);
            }
        });
        
        // Show instruction on tap (for testing/accessibility)
        document.addEventListener('click', function(e) {
            if (e.target.id === 'timetableImg' || e.target.id === 'container') {
                const instruction = document.getElementById('instruction');
                if (instruction.style.display === 'none') {
                    instruction.style.display = 'flex';
                    instruction.style.opacity = '1';
                    
                    setTimeout(() => {
                        instruction.style.opacity = '0';
                        setTimeout(() => {
                            instruction.style.display = 'none';
                        }, 500);
                    }, 2000);
                }
            }
        });
        
        // Handle viewport changes (Safari bottom bar show/hide)
        window.addEventListener('resize', () => {
            adjustImageHeight();
        });
        
        window.addEventListener('orientationchange', () => {
            setTimeout(adjustImageHeight, 100);
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            adjustImageHeight();
            
            // Check if image is already loaded (cached)
            const img = document.getElementById('timetableImg');
            if (img.complete) {
                imageLoaded();
            }
        });
        
        // Add smooth scrolling with touch
        let isScrolling = false;
        let startX = 0;
        let scrollLeft = 0;
        
        const container = document.getElementById('container');
        
        container.addEventListener('touchstart', function(e) {
            isScrolling = true;
            startX = e.touches[0].pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
            e.preventDefault(); // Prevent default only for touchstart
        }, { passive: false });
        
        container.addEventListener('touchmove', function(e) {
            if (!isScrolling) return;
            e.preventDefault(); // Prevent default only when we're handling the scroll
            const x = e.touches[0].pageX - container.offsetLeft;
            const walk = (x - startX) * 2; // Multiply for faster scrolling
            container.scrollLeft = scrollLeft - walk;
        }, { passive: false });
        
        container.addEventListener('touchend', function() {
            isScrolling = false;
        });
        
        // Also enable mouse wheel scrolling
        container.addEventListener('wheel', function(e) {
            // Horizontal scrolling with wheel
            container.scrollLeft += e.deltaY;
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
