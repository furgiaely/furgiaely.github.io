<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="apple-touch-icon" href="https://i.ibb.co/Xk8GpvdD/cedar1.png">
    <title>Even Week Timetable</title>

    <script>
        // check for even week
        (function() {
            // Use local time, not UTC midnight
            const start = new Date(2026, 0, 4); // Year, Month (0-based), Day
            const today = new Date(); // Current date/time
            
            // Get Sunday (0 = Sunday in JavaScript)
            const todaySunday = new Date(today);
            const daysToSubtract = today.getDay(); // 0-6
            todaySunday.setDate(today.getDate() - daysToSubtract);
            
            // Reset times to midnight for accurate calculation
            todaySunday.setHours(0, 0, 0, 0);
            start.setHours(0, 0, 0, 0);
            
            // Calculate weeks (more precise)
            const msPerWeek = 7 * 24 * 60 * 60 * 1000; // 604800000
            const diffMs = todaySunday.getTime() - start.getTime();
            const weeksSince = Math.floor(diffMs / msPerWeek);
            
            let week = weeksSince + 1;
            week = Math.max(1, Math.min(10, week)); // Clamp 1-10
            
            console.log(`Week calculation: ${week} (${week % 2 === 0 ? 'Even' : 'Odd'})`);
            
            // Format current date for display
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = today.toLocaleDateString('en-US', options);
            
            // Store date and week info globally
            window.currentDateInfo = {
                date: formattedDate,
                week: week,
                isEvenWeek: week % 2 === 0
            };
 

        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none; /* Prevent default browser actions */
        }
        
        .timetable-container {
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative;
            /* Enable touch scrolling */
            touch-action: pan-x;
        }
        
        .timetable-image {
            height: 100%;
            width: auto;
            display: block;
            max-height: 100%;
            object-fit: contain;
            object-position: left top;
            /* Enable touch on image */
            touch-action: pan-x;
            user-select: none;
            -webkit-user-drag: none;
        }
        
        /* Compact date and navigation bar */
        .info-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            padding: 10px 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .info-bar.compact {
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.85);
        }
        
        .date-info {
            font-size: 14px;
            line-height: 1.3;
        }
        
        .current-date {
            font-weight: 500;
        }
        
        .week-display {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }
        
        .week-badge {
            display: inline-block;
            background: #007AFF;
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-left: 8px;
        }
        
        .nav-link {
            color: #007AFF;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border: 1px solid rgba(0, 122, 255, 0.3);
            border-radius: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .nav-link:hover {
            background: rgba(0, 122, 255, 0.1);
            border-color: #007AFF;
        }
        
        /* iOS Safe Area Insets */
        @supports (padding: max(0px)) {
            body {
                padding-bottom: env(safe-area-inset-bottom);
                padding-bottom: max(0px, env(safe-area-inset-bottom));
            }
            
            .info-bar {
                padding-top: max(10px, env(safe-area-inset-top));
                padding-left: max(15px, env(safe-area-inset-left));
                padding-right: max(15px, env(safe-area-inset-right));
            }
            
            .timetable-container {
                padding-top: calc(60px + env(safe-area-inset-top));
            }
        }
        
        /* Loading indicator */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading.hidden {
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #007AFF;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Simple instruction - positioned above Safari bar */
        .instruction {
            position: fixed;
            bottom: 70px; /* Above Safari bottom bar */
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 50;
        }
        
        @supports (padding: max(0px)) {
            .instruction {
                bottom: calc(70px + env(safe-area-inset-bottom));
            }
        }
        
        .arrow {
            width: 22px;
            height: 22px;
            position: relative;
        }
        
        .arrow::before,
        .arrow::after {
            content: "";
            position: absolute;
            background: white;
            height: 2px;
            width: 11px;
            border-radius: 1px;
        }
        
        .arrow::before {
            transform: rotate(45deg);
            right: 6px;
            top: 7px;
        }
        
        .arrow::after {
            transform: rotate(-45deg);
            right: 6px;
            top: 13px;
        }
        
        /* Error styling */
        .error {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            height: fill-available;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 1000;
        }
        
        .error.hidden {
            display: none;
        }
        
        .retry-btn {
            margin-top: 25px;
            padding: 14px 28px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 500;
        }
        
        /* Bottom safe area spacer for Safari */
        .safari-spacer {
            height: env(safe-area-inset-bottom);
            height: max(0px, env(safe-area-inset-bottom));
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            background: transparent;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Hide scrollbar for cleaner look */
        .timetable-container::-webkit-scrollbar {
            display: none;
        }
        
        .timetable-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Add some margin to prevent touching edges */
        .timetable-container {
            padding-bottom: 1px;
        }
        
        /* Handle dynamic viewport changes */
        @media (orientation: landscape) {
            .instruction {
                bottom: 20px;
            }
            
            @supports (padding: max(0px)) {
                .instruction {
                    bottom: calc(20px + env(safe-area-inset-bottom));
                }
            }
            
            .info-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 8px 12px;
                gap: 4px;
            }
            
            .date-info {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            .nav-link {
                width: 100%;
                text-align: center;
                padding: 4px 8px;
                font-size: 13px;
            }
            
            .timetable-container {
                padding-top: calc(80px + env(safe-area-inset-top));
            }
        }
        
        /* Disable text selection */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        
        @media (max-width: 768px) {
            .info-bar {
                padding: 8px 12px;
            }
            
            .date-info {
                font-size: 13px;
            }
            
            .week-badge {
                font-size: 12px;
                padding: 2px 8px;
            }
            
            .nav-link {
                font-size: 13px;
                padding: 5px 10px;
            }
        }
        
        /* Auto-hide info bar on scroll */
        @media (max-height: 700px) {
            .info-bar.auto-hide {
                transform: translateY(-100%);
                opacity: 0;
            }
            
            .info-bar.auto-hide:hover,
            .info-bar.auto-hide:focus-within {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Compact info bar with date and navigation -->
    <div class="info-bar" id="infoBar">
        <div class="date-info">
            <div class="current-date" id="currentDate"></div>
            <div class="week-display">
                Week <span id="weekNumber"></span>
                <span class="week-badge" id="weekBadge">Even</span>
            </div>
        </div>
        <a href="timetable_even_nocheck.html" class="nav-link">View Even Week</a>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading timetable...</p>
    </div>
    
    <div class="error hidden" id="error">
        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
        <h3>Image Not Found</h3>
        <p>Could not load "timetable_odd.png"</p>
        <p style="margin-top: 10px; font-size: 15px; opacity: 0.8;">
            Ensure the file is in the same folder
        </p>
        <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>
    
    <div class="timetable-container" id="container">
        <img 
            src="timetable_odd.png" 
            alt="Even Week Timetable" 
            class="timetable-image"
            id="timetableImg"
            onload="imageLoaded()"
            onerror="imageError()"
        >
    </div>
    
    <div class="safari-spacer"></div>
    
    <div class="instruction" id="instruction">
        <span>Swipe left →</span>
        <div class="arrow"></div>
    </div>

    <script>
        // Display current date and week number
        function updateDateDisplay() {
            if (window.currentDateInfo) {
                // Format a shorter date for mobile
                const today = new Date();
                const shortOptions = { weekday: 'short', month: 'short', day: 'numeric' };
                const shortDate = today.toLocaleDateString('en-US', shortOptions);
                
                document.getElementById('currentDate').textContent = shortDate;
                document.getElementById('weekNumber').textContent = window.currentDateInfo.week;
                
                // Update badge
                const badge = document.getElementById('weekBadge');
                if (window.currentDateInfo.isEvenWeek) {
                    badge.textContent = 'Even';
                    badge.style.background = '#34C759'; // Green for even weeks
                } else {
                    badge.textContent = 'Odd';
                    badge.style.background = '#FF3B30'; // Red for odd weeks
                }
            } else {
                // Fallback if calculation didn't run
                const today = new Date();
                const shortOptions = { weekday: 'short', month: 'short', day: 'numeric' };
                const shortDate = today.toLocaleDateString('en-US', shortOptions);
                
                document.getElementById('currentDate').textContent = shortDate;
                document.getElementById('weekNumber').textContent = '?';
            }
        }
        
        // Set image height dynamically based on available space
        function adjustImageHeight() {
            const img = document.getElementById('timetableImg');
            const container = document.getElementById('container');
            
            if (!img.complete) return;
            
            // Calculate available height considering safe areas
            let availableHeight = window.innerHeight;
            
            // Adjust for iOS safe areas
            if (CSS.supports('padding: env(safe-area-inset-bottom)')) {
                const safeAreaBottom = parseInt(getComputedStyle(document.documentElement)
                    .getPropertyValue('--sat') || '0');
                availableHeight -= safeAreaBottom;
            }
            
            // Set image height to available height
            img.style.height = availableHeight + 'px';
            container.style.height = availableHeight + 'px';
        }
        
        // Auto-hide info bar on scroll
        let lastScrollTop = 0;
        const infoBar = document.getElementById('infoBar');
        
        function handleInfoBarVisibility() {
            const container = document.getElementById('container');
            const scrollTop = container.scrollLeft;
            
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                // Scrolling right, hide info bar
                infoBar.classList.add('compact');
                if (window.innerHeight < 700) {
                    infoBar.classList.add('auto-hide');
                }
            } else {
                // Scrolling left or at start, show info bar
                infoBar.classList.remove('compact');
                infoBar.classList.remove('auto-hide');
            }
            
            lastScrollTop = scrollTop;
        }
        
        function imageLoaded() {
            const loading = document.getElementById('loading');
            const instruction = document.getElementById('instruction');
            const img = document.getElementById('timetableImg');
            
            // Update date display first
            updateDateDisplay();
            
            // Adjust height
            adjustImageHeight();
            
            // Hide loading after a short delay
            setTimeout(() => {
                loading.classList.add('hidden');
                
                // Check if scrolling is needed
                if (img.naturalWidth > window.innerWidth) {
                    instruction.style.display = 'flex';
                    
                    // Auto-hide instruction after 4 seconds
                    setTimeout(() => {
                        instruction.style.opacity = '0';
                        instruction.style.transition = 'opacity 0.8s ease';
                        setTimeout(() => {
                            if (parseFloat(getComputedStyle(instruction).opacity) === 0) {
                                instruction.style.display = 'none';
                            }
                        }, 800);
                    }, 4000);
                } else {
                    instruction.style.display = 'none';
                }
                
                // Scroll to show left edge is visible
                const container = document.getElementById('container');
                container.scrollLeft = 0;
                
                // Add a subtle bounce hint if content is scrollable
                if (img.naturalWidth > window.innerWidth) {
                    setTimeout(() => {
                        container.scrollLeft = 30;
                        setTimeout(() => {
                            container.scrollLeft = 0;
                        }, 300);
                    }, 500);
                }
            }, 300);
        }
        
        function imageError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('instruction').style.display = 'none';
            updateDateDisplay();
            adjustImageHeight();
        }
        
        // Hide instruction when user starts scrolling
        let scrollTimer;
        document.getElementById('container').addEventListener('scroll', function() {
            const instruction = document.getElementById('instruction');
            if (instruction.style.display !== 'none') {
                clearTimeout(scrollTimer);
                instruction.style.opacity = '0.5';
                instruction.style.transition = 'opacity 0.3s ease';
                
                scrollTimer = setTimeout(() => {
                    instruction.style.opacity = '0';
                    setTimeout(() => {
                        if (parseFloat(getComputedStyle(instruction).opacity) < 0.1) {
                            instruction.style.display = 'none';
                        }
                    }, 300);
                }, 1000);
            }
            
            // Handle info bar visibility
            handleInfoBarVisibility();
        });
        
        // Show instruction on tap (for testing/accessibility)
        document.addEventListener('click', function(e) {
            if (e.target.id === 'timetableImg' || e.target.id === 'container') {
                const instruction = document.getElementById('instruction');
                if (instruction.style.display === 'none') {
                    instruction.style.display = 'flex';
                    instruction.style.opacity = '1';
                    
                    setTimeout(() => {
                        instruction.style.opacity = '0';
                        setTimeout(() => {
                            instruction.style.display = 'none';
                        }, 500);
                    }, 2000);
                }
                
                // Also show info bar if it was auto-hidden
                if (infoBar.classList.contains('auto-hide')) {
                    infoBar.classList.remove('auto-hide');
                    setTimeout(() => {
                        if (!infoBar.matches(':hover') && !infoBar.contains(document.activeElement)) {
                            infoBar.classList.add('auto-hide');
                        }
                    }, 3000);
                }
            }
        });
        
        // Handle viewport changes (Safari bottom bar show/hide)
        window.addEventListener('resize', () => {
            adjustImageHeight();
            updateDateDisplay();
        });
        
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                adjustImageHeight();
                updateDateDisplay();
            }, 100);
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateDateDisplay();
            adjustImageHeight();
            
            // Check if image is already loaded (cached)
            const img = document.getElementById('timetableImg');
            if (img.complete) {
                imageLoaded();
            }
        });
        
        // Add smooth scrolling with touch
        let isScrolling = false;
        let startX = 0;
        let scrollLeft = 0;
        
        const container = document.getElementById('container');
        
        container.addEventListener('touchstart', function(e) {
            isScrolling = true;
            startX = e.touches[0].pageX - container.offsetLeft;
            scrollLeft = container.scrollLeft;
            e.preventDefault(); // Prevent default only for touchstart
        }, { passive: false });
        
        container.addEventListener('touchmove', function(e) {
            if (!isScrolling) return;
            e.preventDefault(); // Prevent default only when we're handling the scroll
            const x = e.touches[0].pageX - container.offsetLeft;
            const walk = (x - startX) * 2; // Multiply for faster scrolling
            container.scrollLeft = scrollLeft - walk;
        }, { passive: false });
        
        container.addEventListener('touchend', function() {
            isScrolling = false;
        });
        
        // Also enable mouse wheel scrolling
        container.addEventListener('wheel', function(e) {
            // Horizontal scrolling with wheel
            container.scrollLeft += e.deltaY;
            e.preventDefault();
        }, { passive: false });
        
        // Show info bar on hover for auto-hide mode
        infoBar.addEventListener('mouseenter', function() {
            if (this.classList.contains('auto-hide')) {
                this.classList.remove('auto-hide');
            }
        });
        
        infoBar.addEventListener('mouseleave', function() {
            if (window.innerHeight < 700 && container.scrollLeft > 50) {
                setTimeout(() => {
                    if (!this.matches(':hover')) {
                        this.classList.add('auto-hide');
                    }
                }, 500);
            }
        });
        
        // Keep info bar visible when focused (for accessibility)
        infoBar.addEventListener('focusin', function() {
            this.classList.remove('auto-hide');
        });
        
        infoBar.addEventListener('focusout', function() {
            if (window.innerHeight < 700 && container.scrollLeft > 50) {
                setTimeout(() => {
                    if (!this.contains(document.activeElement)) {
                        this.classList.add('auto-hide');
                    }
                }, 500);
            }
        });
    </script>
</body>
</html>
