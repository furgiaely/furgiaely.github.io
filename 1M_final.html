<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Timetable</title>
    <script>
        // Configuration
        const TERM_START_DATE = new Date('2026-01-05'); // January 5, 2026 (Monday, Week 1)
        const TERM_WEEKS = 10; // 10-week school term
        
        // Function to calculate term week for a given date
        function calculateTermWeek(date) {
            // Clone dates to avoid mutation
            const targetDate = new Date(date);
            const termStart = new Date(TERM_START_DATE);
            
            // Set both dates to Monday of their respective weeks
            const targetDay = targetDate.getDay();
            const daysToMonday = targetDay === 0 ? -6 : 1 - targetDay;
            targetDate.setDate(targetDate.getDate() + daysToMonday);
            
            // Calculate difference in weeks
            const diffInMs = targetDate - termStart;
            const diffInWeeks = Math.floor(diffInMs / (1000 * 60 * 60 * 24 * 7));
            
            // Return week number (1-based)
            let termWeek = diffInWeeks + 1;
            
            // Handle dates outside term range
            if (termWeek < 1) return 1;
            if (termWeek > TERM_WEEKS) return TERM_WEEKS;
            
            return termWeek;
        }
        
        // Function to check if week is odd or even
        function isWeekOdd(weekNumber) {
            return weekNumber % 2 === 1;
        }
        
        // Redirect to appropriate timetable
        (function() {
            const today = new Date();
            const termWeek = calculateTermWeek(today);
            const isOddWeek = isWeekOdd(termWeek);
            const timetableUrl = isOddWeek ? 'timetable_odd.png' : 'timetable_even.png';
            
            // Redirect immediately
            window.location.href = timetableUrl;
        })();
    </script>
</head>
<body>
    <!-- No content needed - page will redirect immediately -->
</body>
</html>
